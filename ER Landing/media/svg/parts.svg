  <!-- Qty Matrix -->
  <rect x="450" y="262" width="20" height="14" rx="2" fill="#f1f5f9" stroke="#e2e8f0"/>
  <circle cx="490" cy="269" r="3" fill="#94a3b8"/>
  <rect x="510" y="262" width="20" height="14" rx="2" fill="#f1f5f9" stroke="#e2e8f0"/>
  <circle cx="550" cy="269" r="3" fill="#94a3b8"/>
  <rect x="570" y="262" width="20" height="14" rx="2" fill="#f1f5f9" stroke="#e2e8f0"/>
