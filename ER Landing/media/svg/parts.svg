  <rect x="30" y="261" width="40" height="6" rx="3" fill="#cbd5e1"/>
  <rect x="80" y="261" width="50" height="6" rx="3" fill="#cbd5e1"/>
  <rect x="140" y="255" width="70" height="6" rx="3" fill="#3b82f6"/>
