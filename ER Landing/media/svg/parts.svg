  <rect x="450" y="217" width="20" height="14" rx="2" fill="#ffffff" stroke="#e2e8f0"/>
  <circle cx="490" cy="224" r="3" fill="#94a3b8"/>
  <rect x="510" y="217" width="20" height="14" rx="2" fill="#ffffff" stroke="#e2e8f0"/>
  <circle cx="550" cy="224" r="3" fill="#94a3b8"/>
  <rect x="570" y="217" width="20" height="14" rx="2" fill="#ffffff" stroke="#e2e8f0"/>
  <circle cx="610" cy="224" r="3" fill="#94a3b8"/>
  <rect x="630" y="217" width="30" height="14" rx="2" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="740" y="215" width="20" height="4" rx="2" fill="#3b82f6"/>
  <rect x="740" y="223" width="20" height="4" rx="2" fill="#3b82f6"/>
  <rect x="740" y="231" width="20" height="4" rx="2" fill="#3b82f6"/>
