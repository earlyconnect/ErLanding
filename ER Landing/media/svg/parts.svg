  <rect x="630" y="262" width="30" height="14" rx="2" fill="#f1f5f9" stroke="#e2e8f0"/>
  <rect x="740" y="255" width="20" height="4" rx="2" fill="#3b82f6"/>
  <rect x="740" y="265" width="20" height="4" rx="2" fill="#3b82f6"/>
  <rect x="740" y="275" width="20" height="4" rx="2" fill="#3b82f6"/>
