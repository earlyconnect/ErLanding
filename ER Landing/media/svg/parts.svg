  <!-- PO / Part Links (Blue) -->
  <rect x="140" y="181" width="80" height="6" rx="3" fill="#3b82f6"/>
  <!-- Description (Blue) -->
  <rect x="260" y="181" width="120" height="6" rx="3" fill="#3b82f6"/>
  <!-- Price -->
  <rect x="400" y="181" width="30" height="6" rx="3" fill="#94a3b8"/>
  <!-- Qty Matrix (Inputs & Numbers) -->
  <rect x="450" y="177" width="20" height="14" rx="2" fill="#f1f5f9" stroke="#e2e8f0"/>
  <circle cx="490" cy="184" r="3" fill="#94a3b8"/>
  <rect x="510" y="177" width="20" height="14" rx="2" fill="#f1f5f9" stroke="#e2e8f0"/>
  <circle cx="550" cy="184" r="3" fill="#94a3b8"/>
  <rect x="570" y="177" width="20" height="14" rx="2" fill="#f1f5f9" stroke="#e2e8f0"/>
