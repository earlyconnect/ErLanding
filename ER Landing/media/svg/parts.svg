<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <!-- Window Background with slight border -->
  <rect width="800" height="450" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  
  <!-- App Header (EarlyRepair Blue) -->
  <path d="M 0 12 Q 0 0 12 0 L 788 0 Q 800 0 800 12 L 800 50 L 0 50 Z" fill="#2563eb"/>
  
  <!-- Abstract Logo -->
  <rect x="20" y="15" width="120" height="20" rx="4" fill="#ffffff" opacity="0.9"/>
  
  <!-- Abstract Top Nav Links (Active tab shifted to "Parts") -->
  <rect x="460" y="21" width="50" height="8" rx="4" fill="#ffffff" opacity="0.5"/>
  <rect x="530" y="21" width="60" height="8" rx="4" fill="#ffffff" opacity="0.5"/>
  <!-- Active Tab (Parts) -->
  <rect x="610" y="17" width="50" height="16" rx="8" fill="#ffffff" opacity="1.0"/>
  <rect x="680" y="21" width="40" height="8" rx="4" fill="#ffffff" opacity="0.5"/>
  <circle cx="760" cy="25" r="10" fill="#ffffff" opacity="0.3"/>

  <!-- Top Filter Bar (Dropdowns & Search) -->
  <rect x="20" y="65" width="120" height="24" rx="4" fill="#f1f5f9"/>
  <rect x="150" y="65" width="120" height="24" rx="4" fill="#f1f5f9"/>
  <rect x="280" y="65" width="140" height="24" rx="4" fill="#f1f5f9"/>
  <rect x="430" y="65" width="180" height="24" rx="4" fill="#f1f5f9"/>
  
  <!-- Action Buttons (Refresh/Save) -->
  <rect x="650" y="65" width="60" height="24" rx="4" fill="#2563eb"/>
  <rect x="720" y="65" width="60" height="24" rx="4" fill="#2563eb"/>

  <!-- Secondary Action Bar (Add PO buttons, etc.) -->
  <rect x="430" y="105" width="80" height="18" rx="4" fill="#60a5fa"/>
  <rect x="520" y="105" width="60" height="18" rx="4" fill="#60a5fa"/>
  <rect x="590" y="105" width="100" height="18" rx="4" fill="#60a5fa"/>
  
  <!-- Auto Save Toggle -->
  <circle cx="740" cy="114" r="6" fill="#22c55e"/>
  <rect x="752" y="112" width="28" height="4" rx="2" fill="#94a3b8"/>

  <!-- Table Header Bar -->
