  <rect x="30" y="311" width="40" height="6" rx="3" fill="#cbd5e1"/>
  <rect x="80" y="311" width="60" height="6" rx="3" fill="#cbd5e1"/>
  <rect x="150" y="311" width="70" height="6" rx="3" fill="#3b82f6"/>
  <rect x="260" y="311" width="100" height="6" rx="3" fill="#3b82f6"/>
  <rect x="400" y="311" width="30" height="6" rx="3" fill="#94a3b8"/>
  <rect x="450" y="307" width="20" height="14" rx="2" fill="#ffffff" stroke="#e2e8f0"/>
  <circle cx="490" cy="314" r="3" fill="#94a3b8"/>
  <rect x="510" y="307" width="20" height="14" rx="2" fill="#ffffff" stroke="#e2e8f0"/>
  <circle cx="550" cy="314" r="3" fill="#94a3b8"/>
  <rect x="570" y="307" width="20" height="14" rx="2" fill="#ffffff" stroke="#e2e8f0"/>
  <circle cx="610" cy="314" r="3" fill="#94a3b8"/>
  <rect x="630" y="307" width="30" height="14" rx="2" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="740" y="305" width="20" height="4" rx="2" fill="#3b82f6"/>
  <rect x="740" y="313" width="20" height="4" rx="2" fill="#3b82f6"/>
  <rect x="740" y="321" width="20" height="4" rx="2" fill="#3b82f6"/>
  <circle cx="730" cy="313" r="3" fill="#a855f7"/>
  
  <!-- Row 5 (White Background) -->
  <rect x="20" y="335" width="760" height="40" fill="#ffffff"/>
  <rect x="30" y="351" width="40" height="6" rx="3" fill="#cbd5e1"/>
  <rect x="80" y="351" width="50" height="6" rx="3" fill="#cbd5e1"/>
  <rect x="140" y="351" width="80" height="6" rx="3" fill="#3b82f6"/>
  <rect x="260" y="351" width="120" height="6" rx="3" fill="#3b82f6"/>
  <rect x="400" y="351" width="30" height="6" rx="3" fill="#94a3b8"/>
  <rect x="450" y="347" width="20" height="14" rx="2" fill="#f1f5f9" stroke="#e2e8f0"/>
  <circle cx="490" cy="354" r="3" fill="#94a3b8"/>
  <rect x="510" y="347" width="20" height="14" rx="2" fill="#f1f5f9" stroke="#e2e8f0"/>
  <circle cx="550" cy="354" r="3" fill="#94a3b8"/>
  <rect x="570" y="347" width="20" height="14" rx="2" fill="#f1f5f9" stroke="#e2e8f0"/>
  <circle cx="610" cy="354" r="3" fill="#94a3b8"/>
  <rect x="630" y="347" width="30" height="14" rx="2" fill="#f1f5f9" stroke="#e2e8f0"/>
  <rect x="740" y="345" width="20" height="4" rx="2" fill="#3b82f6"/>
  <rect x="740" y="353" width="20" height="4" rx="2" fill="#3b82f6"/>
  <rect x="740" y="361" width="20" height="4" rx="2" fill="#3b82f6"/>
  <circle cx="730" cy="353" r="3" fill="#a855f7"/>

  <!-- Bottom fade gradient to blend smoothly into the card -->
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1" />
    </linearGradient>
  </defs>
  <rect x="0" y="350" width="800" height="100" fill="url(#fade)" rx="12"/>
