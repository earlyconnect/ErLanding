<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <!-- Window Background with slight border -->
  <rect width="800" height="450" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  
  <!-- App Header (EarlyRepair Blue) - Kept consistent with previous SVG -->
  <path d="M 0 12 Q 0 0 12 0 L 788 0 Q 800 0 800 12 L 800 50 L 0 50 Z" fill="#2563eb"/>
  
  <!-- Abstract Logo -->
  <rect x="20" y="15" width="120" height="20" rx="4" fill="#ffffff" opacity="0.9"/>
  
  <!-- Abstract Top Nav Links -->
  <rect x="460" y="21" width="50" height="8" rx="4" fill="#ffffff" opacity="0.5"/>
  <!-- Active Tab (Tickets) -->
  <rect x="530" y="17" width="60" height="16" rx="8" fill="#ffffff" opacity="1.0"/>
  <rect x="610" y="21" width="50" height="8" rx="4" fill="#ffffff" opacity="0.5"/>
  <rect x="680" y="21" width="40" height="8" rx="4" fill="#ffffff" opacity="0.5"/>
  <circle cx="760" cy="25" r="10" fill="#ffffff" opacity="0.3"/>

  <!-- Sub-Header (Map Controls) -->
  <!-- Location Dropdown -->
  <rect x="20" y="65" width="200" height="24" rx="4" fill="#f1f5f9"/>
  <rect x="30" y="73" width="60" height="8" rx="4" fill="#cbd5e1"/>
  <!-- Date Picker -->
  <rect x="350" y="65" width="100" height="24" rx="12" fill="#f1f5f9"/>
  <rect x="375" y="73" width="50" height="8" rx="4" fill="#94a3b8"/>
  <circle cx="340" cy="77" r="4" fill="#3b82f6"/>
  <circle cx="460" cy="77" r="4" fill="#3b82f6"/>
  <!-- Show Button -->
  <rect x="710" y="65" width="70" height="24" rx="4" fill="#2563eb"/>
  <rect x="730" y="73" width="30" height="8" rx="4" fill="#ffffff"/>

  <!-- MAP AREA -->
  <clipPath id="map-clip">
    <rect x="0" y="100" width="800" height="350" rx="0"/>
  </clipPath>
  
  <g clip-path="url(#map-clip)">
    <!-- Map Background -->
    <rect x="0" y="100" width="800" height="350" fill="#e2f5e9"/>
    
    <!-- Abstract Highways/Roads -->
    <path d="M -50 150 Q 200 200 400 120 T 850 250" fill="none" stroke="#bbf7d0" stroke-width="12"/>
    <path d="M 100 450 Q 300 300 350 100" fill="none" stroke="#bbf7d0" stroke-width="8"/>
    <path d="M 300 450 Q 400 250 850 150" fill="none" stroke="#a7f3d0" stroke-width="6"/>
    <path d="M 600 100 Q 550 250 650 450" fill="none" stroke="#a7f3d0" stroke-width="6"/>
    
    <!-- Routing Lines (Connecting Tickets) -->
    <polyline points="380,200 410,260 460,230 490,280 430,320 360,280" fill="none" stroke="#64748b" stroke-width="2"/>
    
    <!-- Map Markers (Clustered) -->
    <!-- Red Pin -->
    <circle cx="380" cy="200" r="8" fill="#ef4444" stroke="#ffffff" stroke-width="2"/>
    <!-- Green Pin -->
    <circle cx="410" cy="260" r="8" fill="#22c55e" stroke="#ffffff" stroke-width="2"/>
    <!-- Black Pin -->
    <circle cx="460" cy="230" r="8" fill="#0f172a" stroke="#ffffff" stroke-width="2"/>
    <!-- Blue Pin -->
    <circle cx="490" cy="280" r="8" fill="#3b82f6" stroke="#ffffff" stroke-width="2"/>
    <!-- Black Pin -->
    <circle cx="430" cy="320" r="8" fill="#0f172a" stroke="#ffffff" stroke-width="2"/>
    <!-- Red Pin -->
    <circle cx="360" cy="280" r="8" fill="#ef4444" stroke="#ffffff" stroke-width="2"/>
    
    <!-- Left Floating Panel (Status/Legend) -->
    <rect x="20" y="120" width="160" height="280" rx="8" fill="#ffffff" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.1))"/>
    <!-- Tabs -->
    <rect x="20" y="120" width="80" height="30" rx="8" fill="#1e293b"/>
    <rect x="100" y="120" width="80" height="30" rx="8" fill="#f8fafc"/>
    <rect x="35" y="131" width="50" height="8" rx="4" fill="#ffffff"/>
    <rect x="115" y="131" width="50" height="8" rx="4" fill="#94a3b8"/>
    <!-- Legend Items -->
    <circle cx="35" cy="170" r="5" fill="#f97316"/>
    <rect x="50" y="167" width="90" height="6" rx="3" fill="#cbd5e1"/>
    
    <circle cx="35" cy="190" r="5" fill="#ef4444"/>
    <rect x="50" y="187" width="110" height="6" rx="3" fill="#cbd5e1"/>
    
    <circle cx="35" cy="210" r="5" fill="#ef4444"/>
    <rect x="50" y="207" width="80" height="6" rx="3" fill="#cbd5e1"/>
    
    <circle cx="35" cy="230" r="5" fill="#eab308"/>
    <rect x="50" y="227" width="100" height="6" rx="3" fill="#cbd5e1"/>
    
    <circle cx="35" cy="250" r="5" fill="#eab308"/>
    <rect x="50" y="247" width="70" height="6" rx="3" fill="#cbd5e1"/>
    
    <circle cx="35" cy="270" r="5" fill="#a855f7"/>
    <rect x="50" y="267" width="90" height="6" rx="3" fill="#cbd5e1"/>

    <!-- Right Floating Panel (Selected Day's Tickets) -->
    <rect x="560" y="120" width="220" height="150" rx="8" fill="#ffffff" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.1))"/>
    <path d="M 560 128 Q 560 120 568 120 L 772 120 Q 780 120 780 128 L 780 150 L 560 150 Z" fill="#0f172a"/>
    <rect x="630" y="131" width="80" height="8" rx="4" fill="#ffffff"/>
    <!-- Column Headers -->
    <rect x="595" y="160" width="40" height="6" rx="3" fill="#94a3b8"/>
    <rect x="670" y="160" width="20" height="6" rx="3" fill="#94a3b8"/>
    <rect x="710" y="160" width="20" height="6" rx="3" fill="#94a3b8"/>
    <rect x="745" y="160" width="20" height="6" rx="3" fill="#94a3b8"/>
    
    <!-- Tech 1 -->
    <rect x="570" y="180" width="12" height="12" rx="2" fill="#3b82f6"/>
    <circle cx="595" cy="186" r="5" fill="#3b82f6"/>
    <rect x="610" y="183" width="40" height="6" rx="3" fill="#cbd5e1"/>
    <rect x="675" y="183" width="10" height="6" rx="3" fill="#64748b"/>
    <rect x="715" y="183" width="10" height="6" rx="3" fill="#64748b"/>
    <rect x="750" y="183" width="10" height="6" rx="3" fill="#64748b"/>
    
    <!-- Tech 2 -->
    <rect x="570" y="200" width="12" height="12" rx="2" fill="#3b82f6"/>
    <circle cx="595" cy="206" r="5" fill="#f97316"/>
    <rect x="610" y="203" width="45" height="6" rx="3" fill="#cbd5e1"/>
    <rect x="675" y="203" width="10" height="6" rx="3" fill="#64748b"/>
    <rect x="715" y="203" width="10" height="6" rx="3" fill="#64748b"/>
    <rect x="750" y="203" width="10" height="6" rx="3" fill="#64748b"/>
    
    <!-- Tech 3 -->
    <rect x="570" y="220" width="12" height="12" rx="2" fill="#3b82f6"/>
    <circle cx="595" cy="226" r="5" fill="#ec4899"/>
    <rect x="610" y="223" width="35" height="6" rx="3" fill="#cbd5e1"/>
    <rect x="675" y="223" width="10" height="6" rx="3" fill="#64748b"/>
    <rect x="715" y="223" width="10" height="6" rx="3" fill="#64748b"/>
    <rect x="750" y="223" width="10" height="6" rx="3" fill="#64748b"/>
    
    <!-- Tech 4 -->
    <rect x="570" y="240" width="12" height="12" rx="2" fill="#3b82f6"/>
    <circle cx="595" cy="246" r="5" fill="#06b6d4"/>
    <rect x="610" y="243" width="50" height="6" rx="3" fill="#cbd5e1"/>
    <rect x="675" y="243" width="10" height="6" rx="3" fill="#64748b"/>
    <rect x="715" y="243" width="10" height="6" rx="3" fill="#64748b"/>
    <rect x="750" y="243" width="10" height="6" rx="3" fill="#64748b"/>
  </g>
  
  <!-- Bottom fade gradient to blend smoothly into the card -->
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1" />
    </linearGradient>
  </defs>
  <rect x="0" y="350" width="800" height="100" fill="url(#fade)" rx="12"/>
</svg>
