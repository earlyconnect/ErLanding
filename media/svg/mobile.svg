<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <!-- Window Background with slight border -->
  <rect width="800" height="450" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  
  <!-- App Header (EarlyRepair Blue) -->
  <path d="M 0 12 Q 0 0 12 0 L 788 0 Q 800 0 800 12 L 800 50 L 0 50 Z" fill="#2563eb"/>
  
  <!-- Abstract Logo (TAS) -->
  <rect x="20" y="15" width="60" height="20" rx="4" fill="#ffffff" opacity="0.9"/>
  
  <!-- Center Header Element (Service Report) -->
  <circle cx="380" cy="25" r="10" fill="#facc15"/>
  <rect x="400" y="21" width="100" height="8" rx="4" fill="#ffffff" opacity="0.9"/>
  
  <!-- Right User Pill (Ali) -->
  <rect x="710" y="13" width="70" height="24" rx="12" fill="#ffffff"/>
  <rect x="735" y="21" width="20" height="8" rx="4" fill="#3b82f6"/>

  <!-- Main Ticket Header Card (Blue Panel) -->
  <rect x="20" y="65" width="760" height="100" rx="8" fill="#3b82f6"/>
  <!-- Left Side: Status / Location Indicator -->
  <rect x="40" y="125" width="100" height="16" rx="4" fill="#991b1b"/>
  <rect x="70" y="85" width="40" height="6" rx="3" fill="#ffffff" opacity="0.8"/>
  <rect x="60" y="100" width="60" height="6" rx="3" fill="#ffffff" opacity="0.8"/>
  <!-- Divider -->
  <rect x="160" y="80" width="2" height="60" fill="#60a5fa"/>
  <!-- Ticket Info Lines -->
  <!-- ID -->
  <rect x="180" y="80" width="160" height="10" rx="3" fill="#ffffff"/>
  <!-- Status (Ready for Service) -->
  <rect x="180" y="98" width="100" height="6" rx="3" fill="#ffffff" opacity="0.9"/>
  <!-- Tech Name -->
  <rect x="180" y="112" width="120" height="6" rx="3" fill="#bfdbfe"/>
  <!-- Address -->
  <rect x="180" y="126" width="240" height="6" rx="3" fill="#bfdbfe"/>
  <!-- Time -->
  <rect x="180" y="140" width="180" height="6" rx="3" fill="#bfdbfe"/>
  <!-- Right Chevron -->
  <path d="M 740 115 L 720 95 L 715 100 L 730 115 L 715 130 L 720 135 Z" fill="#ffffff" opacity="0.7"/>

  <!-- Tabs (Bottom of Header Card) -->
  <rect x="40" y="165" width="280" height="20" rx="4" fill="#2563eb"/>
  <rect x="45" y="167" width="60" height="16" rx="4" fill="#ffffff"/> <!-- Active Tab -->
  <rect x="115" y="172" width="40" height="6" rx="3" fill="#ffffff" opacity="0.7"/>
  <rect x="175" y="172" width="30" height="6" rx="3" fill="#ffffff" opacity="0.7"/>
  <rect x="225" y="172" width="40" height="6" rx="3" fill="#ffffff" opacity="0.7"/>

  <!-- Alert Message Row -->
  <rect x="20" y="195" width="760" height="24" fill="#fef9c3"/>
  <rect x="30" y="204" width="220" height="6" rx="3" fill="#ef4444"/>

  <!-- Quick Action Buttons -->
  <rect x="280" y="235" width="120" height="32" rx="6" fill="#991b1b"/>
  <rect x="305" y="247" width="70" height="8" rx="4" fill="#ffffff"/>
  <rect x="415" y="235" width="100" height="32" rx="6" fill="#16a34a"/>
  <rect x="435" y="247" width="60" height="8" rx="4" fill="#ffffff"/>

  <!-- General Information Section -->
  <rect x="20" y="285" width="760" height="24" fill="#e2e8f0"/>
  <rect x="30" y="294" width="120" height="6" rx="3" fill="#475569"/>
  <!-- Collapse Icon -->
  <circle cx="760" cy="297" r="6" fill="#94a3b8"/>
  <rect x="756" y="296" width="8" height="2" fill="#ffffff"/>

  <!-- Form Fields: Row 1 (Name) -->
  <rect x="30" y="320" width="80" height="22" rx="11" fill="#cbd5e1"/>
  <rect x="120" y="320" width="200" height="22" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="130" y="328" width="60" height="6" rx="3" fill="#94a3b8"/>
  <rect x="330" y="320" width="200" height="22" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="340" y="328" width="80" height="6" rx="3" fill="#94a3b8"/>
  <rect x="540" y="320" width="90" height="22" rx="4" fill="#ea580c"/>
  <rect x="555" y="328" width="60" height="6" rx="3" fill="#ffffff"/>

  <!-- Form Fields: Row 2 (Address) -->
  <rect x="30" y="352" width="80" height="22" rx="11" fill="#cbd5e1"/>
  <rect x="120" y="360" width="250" height="6" rx="3" fill="#3b82f6"/> <!-- Link style -->

  <!-- Form Fields: Row 3 (Status Check-in Buttons) -->
  <rect x="240" y="384" width="80" height="28" rx="4" fill="#64748b"/>
  <rect x="255" y="394" width="50" height="8" rx="4" fill="#ffffff"/>
  <rect x="330" y="384" width="70" height="28" rx="4" fill="#3b82f6"/>
  <rect x="342" y="394" width="45" height="8" rx="4" fill="#ffffff"/>
  <rect x="410" y="384" width="80" height="28" rx="4" fill="#3b82f6"/>
  <rect x="425" y="394" width="50" height="8" rx="4" fill="#ffffff"/>

  <!-- Product Information Section (Peeking from bottom) -->
  <rect x="20" y="430" width="760" height="24" fill="#e2e8f0"/>
  <rect x="30" y="439" width="130" height="6" rx="3" fill="#475569"/>
  <rect x="630" y="434" width="100" height="16" rx="4" fill="#16a34a"/>
  
  <!-- Bottom fade gradient to blend smoothly into the card -->
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1" />
    </linearGradient>
  </defs>
  <rect x="0" y="350" width="800" height="100" fill="url(#fade)" rx="12"/>
</svg>
