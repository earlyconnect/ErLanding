<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <!-- Window Background with slight border -->
  <rect width="800" height="450" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  
  <!-- Left Navigation Sidebar -->
  <rect x="12" y="12" width="46" height="426" rx="23" fill="#2563eb"/>
  <!-- Sidebar Icons (Abstracted) -->
  <circle cx="35" cy="40" r="12" fill="#ffffff" opacity="0.2"/>
  <rect x="27" y="36" width="16" height="8" rx="2" fill="#ffffff"/>
  
  <rect x="29" y="80" width="12" height="12" rx="2" fill="#ffffff" opacity="0.8"/>
  <path d="M 29 80 L 35 74 L 41 80" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.8"/>
  
  <rect x="27" y="120" width="4" height="12" rx="2" fill="#ffffff" opacity="0.8"/>
  <rect x="33" y="116" width="4" height="16" rx="2" fill="#ffffff" opacity="0.8"/>
  <rect x="39" y="124" width="4" height="8" rx="2" fill="#ffffff" opacity="0.8"/>
  
  <circle cx="35" cy="160" r="7" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.8"/>
  
  <rect x="27" y="196" width="16" height="12" rx="2" fill="#ffffff" opacity="0.8"/>
  
  <!-- Bottom Sidebar Profile/Settings -->
  <circle cx="35" cy="405" r="14" fill="#ffffff"/>
  <rect x="29" y="403" width="12" height="4" rx="2" fill="#3b82f6"/>

  <!-- Top Header Area -->
  <!-- Main Title ("Overall Status") -->
  <rect x="320" y="25" width="180" height="12" rx="6" fill="#0f172a"/>
  <rect x="340" y="42" width="140" height="4" rx="2" fill="#0f172a"/>
  
  <!-- Top Right Filters & Controls -->
  <!-- Location Dropdown -->
  <rect x="560" y="25" width="60" height="20" rx="4" fill="#f1f5f9"/>
  <rect x="570" y="32" width="30" height="6" rx="3" fill="#94a3b8"/>
  <!-- Date Range Picker -->
  <rect x="630" y="25" width="100" height="20" rx="4" fill="#f1f5f9"/>
  <rect x="640" y="32" width="80" height="6" rx="3" fill="#94a3b8"/>
  <!-- Refresh Button -->
  <rect x="740" y="25" width="40" height="20" rx="4" fill="#3b82f6"/>
  <rect x="750" y="32" width="20" height="6" rx="3" fill="#ffffff"/>

  <!-- Main Chart Area -->
  
  <!-- Chart 1: Monthly Statistics -->
  <g transform="translate(70, 70)">
    <!-- Chart Background -->
    <rect x="0" y="0" width="340" height="180" fill="#ffffff"/>
    
    <!-- Chart Title -->
    <rect x="70" y="10" width="200" height="10" rx="5" fill="#475569"/>
    
    <!-- Grid Lines -->
    <line x1="0" y1="40" x2="340" y2="40" stroke="#f1f5f9" stroke-width="1"/>
    <line x1="0" y1="75" x2="340" y2="75" stroke="#f1f5f9" stroke-width="1"/>
    <line x1="0" y1="110" x2="340" y2="110" stroke="#f1f5f9" stroke-width="1"/>
    <line x1="0" y1="145" x2="340" y2="145" stroke="#f1f5f9" stroke-width="1"/>
    <!-- Vertical grid dividers -->
    <line x1="42" y1="30" x2="42" y2="160" stroke="#f1f5f9" stroke-width="1"/>
    <line x1="127" y1="30" x2="127" y2="160" stroke="#f1f5f9" stroke-width="1"/>
    <line x1="212" y1="30" x2="212" y2="160" stroke="#f1f5f9" stroke-width="1"/>
    <line x1="297" y1="30" x2="297" y2="160" stroke="#f1f5f9" stroke-width="1"/>
    
    <!-- Data Lines (Smooth bezier curves mimicking the image) -->
    <!-- Red Line (Highest volume) -->
    <path d="M 0 50 C 40 60, 80 80, 120 70 C 160 60, 200 40, 240 50 C 280 60, 310 30, 330 150 L 340 150" fill="none" stroke="#b91c1c" stroke-width="2.5"/>
    <!-- Tan Line (Secondary volume) -->
    <path d="M 0 100 C 50 110, 100 120, 150 100 C 200 80, 250 60, 300 40 L 330 155 L 340 155" fill="none" stroke="#d97706" stroke-width="2"/>
    <!-- Blue Line (Base volume) -->
    <path d="M 0 135 C 40 130, 80 140, 120 135 C 160 130, 200 145, 240 140 C 280 135, 300 130, 340 135" fill="none" stroke="#2563eb" stroke-width="2"/>
    <!-- Bottom flatlines for smaller data sets -->
    <path d="M 0 150 L 340 150" fill="none" stroke="#059669" stroke-width="1.5"/>
    <path d="M 0 155 L 340 155" fill="none" stroke="#4b5563" stroke-width="1.5"/>
  </g>

  <!-- Chart 2: Daily Statistics (Spiky) -->
  <g transform="translate(430, 70)">
    <!-- Chart Background -->
    <rect x="0" y="0" width="340" height="180" fill="#ffffff"/>
    
    <!-- Chart Title -->
    <rect x="90" y="10" width="160" height="10" rx="5" fill="#475569"/>
    
    <!-- Grid Lines -->
    <line x1="0" y1="40" x2="340" y2="40" stroke="#f1f5f9" stroke-width="1"/>
    <line x1="0" y1="75" x2="340" y2="75" stroke="#f1f5f9" stroke-width="1"/>
    <line x1="0" y1="110" x2="340" y2="110" stroke="#f1f5f9" stroke-width="1"/>
    <line x1="0" y1="145" x2="340" y2="145" stroke="#f1f5f9" stroke-width="1"/>
    
    <!-- Data Lines (Jagged, representing daily volatility) -->
    <!-- Red Line -->
    <path d="M 0 130 L 15 25 L 35 60 L 50 55 L 65 95 L 80 80 L 105 130 L 120 40 L 140 70 L 165 90 L 180 140 L 205 30 L 225 70 L 245 90 L 255 140 L 275 35 L 295 50 L 315 110 L 330 140 L 340 40" fill="none" stroke="#b91c1c" stroke-width="2"/>
    <!-- Tan Line -->
    <path d="M 0 150 L 15 80 L 35 95 L 50 90 L 65 115 L 80 110 L 105 140 L 120 70 L 140 90 L 165 105 L 180 145 L 205 60 L 225 90 L 245 105 L 255 145 L 275 70 L 295 80 L 315 130 L 330 145 L 340 70" fill="none" stroke="#d97706" stroke-width="1.5"/>
    <!-- Blue Line (Base daily) -->
    <path d="M 0 150 L 20 140 L 40 145 L 60 135 L 80 140 L 100 150 L 120 135 L 140 145 L 160 140 L 180 150 L 200 130 L 220 140 L 240 145 L 260 150 L 280 130 L 300 140 L 320 145 L 340 130" fill="none" stroke="#2563eb" stroke-width="1.5"/>
  </g>

  <!-- Chart Legends (Abstracted color dots) -->
  <rect x="70" y="235" width="700" height="15" fill="#ffffff"/>
  <!-- Series 1 -->
  <circle cx="80" cy="242" r="4" fill="#0d9488"/> <rect x="90" y="240" width="30" height="4" rx="2" fill="#cbd5e1"/>
  <circle cx="135" cy="242" r="4" fill="#8b5cf6"/> <rect x="145" y="240" width="40" height="4" rx="2" fill="#cbd5e1"/>
  <circle cx="200" cy="242" r="4" fill="#d97706"/> <rect x="210" y="240" width="50" height="4" rx="2" fill="#cbd5e1"/>
  <circle cx="275" cy="242" r="4" fill="#3b82f6"/> <rect x="285" y="240" width="30" height="4" rx="2" fill="#cbd5e1"/>
  <circle cx="330" cy="242" r="4" fill="#b91c1c"/> <rect x="340" y="240" width="45" height="4" rx="2" fill="#cbd5e1"/>
  <!-- More Legend Items -->
  <circle cx="430" cy="242" r="4" fill="#059669"/> <rect x="440" y="240" width="35" height="4" rx="2" fill="#cbd5e1"/>
  <circle cx="490" cy="242" r="4" fill="#ca8a04"/> <rect x="500" y="240" width="45" height="4" rx="2" fill="#cbd5e1"/>
  <circle cx="560" cy="242" r="4" fill="#4f46e5"/> <rect x="570" y="240" width="55" height="4" rx="2" fill="#cbd5e1"/>
  <circle cx="640" cy="242" r="4" fill="#be123c"/> <rect x="650" y="240" width="25" height="4" rx="2" fill="#cbd5e1"/>
  <circle cx="690" cy="242" r="4" fill="#475569"/> <rect x="700" y="240" width="30" height="4" rx="2" fill="#cbd5e1"/>

  <!-- Bottom Section: Sub-reports -->
  <!-- Column 1: Pending Tickets by Status -->
  <rect x="90" y="280" width="180" height="8" rx="4" fill="#334155"/>
  <rect x="80" y="310" width="200" height="60" rx="6" fill="#f8fafc"/>
  <rect x="90" y="325" width="140" height="6" rx="3" fill="#cbd5e1"/>
  <rect x="90" y="340" width="100" height="6" rx="3" fill="#cbd5e1"/>
  <rect x="90" y="355" width="160" height="6" rx="3" fill="#cbd5e1"/>
  
  <!-- Column 2: Pending Tickets by Location -->
  <rect x="330" y="280" width="180" height="8" rx="4" fill="#334155"/>
  <rect x="320" y="310" width="200" height="60" rx="6" fill="#f8fafc"/>
  <circle cx="350" cy="340" r="15" fill="#e2e8f0"/>
  <rect x="380" y="332" width="100" height="6" rx="3" fill="#cbd5e1"/>
  <rect x="380" y="344" width="60" height="6" rx="3" fill="#cbd5e1"/>

  <!-- Column 3: CSR Activity (Donut Chart) -->
  <rect x="610" y="280" width="100" height="8" rx="4" fill="#334155"/>
  
  <g transform="translate(660, 350)">
    <!-- Circumference of r=40 is ~251.2 -->
    <!-- Teal segment -->
    <circle cx="0" cy="0" r="40" fill="none" stroke="#0d9488" stroke-width="25" stroke-dasharray="80 251.2" stroke-dashoffset="0"/>
    <!-- Purple segment -->
    <circle cx="0" cy="0" r="40" fill="none" stroke="#a855f7" stroke-width="25" stroke-dasharray="40 251.2" stroke-dashoffset="-80"/>
    <!-- Tan segment -->
    <circle cx="0" cy="0" r="40" fill="none" stroke="#d97706" stroke-width="25" stroke-dasharray="35 251.2" stroke-dashoffset="-120"/>
    <!-- Blue segment -->
    <circle cx="0" cy="0" r="40" fill="none" stroke="#3b82f6" stroke-width="25" stroke-dasharray="25 251.2" stroke-dashoffset="-155"/>
    <!-- Pink segment -->
    <circle cx="0" cy="0" r="40" fill="none" stroke="#db2777" stroke-width="25" stroke-dasharray="20 251.2" stroke-dashoffset="-180"/>
    <!-- Red segment -->
    <circle cx="0" cy="0" r="40" fill="none" stroke="#dc2626" stroke-width="25" stroke-dasharray="15 251.2" stroke-dashoffset="-200"/>
    <!-- Granular dashed segment for the remaining small fractions -->
    <circle cx="0" cy="0" r="40" fill="none" stroke="#94a3b8" stroke-width="25" stroke-dasharray="4 2" stroke-dashoffset="-215"/>
    <!-- Inner White Cutout for clean donut look -->
    <circle cx="0" cy="0" r="28" fill="#ffffff"/>
  </g>

  <!-- Bottom fade gradient to blend smoothly into the card -->
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1" />
    </linearGradient>
  </defs>
  <rect x="0" y="350" width="800" height="100" fill="url(#fade)" rx="12"/>
</svg>
