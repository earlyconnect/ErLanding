<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <!-- Window Background with slight border -->
  <rect width="800" height="450" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  
  <!-- App Header (EarlyRepair Blue) -->
  <path d="M 0 12 Q 0 0 12 0 L 788 0 Q 800 0 800 12 L 800 50 L 0 50 Z" fill="#2563eb"/>
  
  <!-- Abstract Logo -->
  <rect x="20" y="15" width="120" height="20" rx="4" fill="#ffffff" opacity="0.9"/>
  
  <!-- Abstract Top Nav Links -->
  <rect x="460" y="21" width="50" height="8" rx="4" fill="#ffffff" opacity="0.5"/>
  <!-- Active Tab (Tickets) -->
  <rect x="530" y="17" width="60" height="16" rx="8" fill="#ffffff" opacity="1.0"/>
  <rect x="610" y="21" width="50" height="8" rx="4" fill="#ffffff" opacity="0.5"/>
  <rect x="680" y="21" width="40" height="8" rx="4" fill="#ffffff" opacity="0.5"/>
  <circle cx="760" cy="25" r="10" fill="#ffffff" opacity="0.3"/>

  <!-- Search & Filter Bar -->
  <rect x="20" y="70" width="140" height="24" rx="4" fill="#f1f5f9"/>
  <rect x="170" y="70" width="180" height="24" rx="4" fill="#f1f5f9"/>
  <rect x="360" y="70" width="140" height="24" rx="4" fill="#f1f5f9"/>
  <rect x="510" y="70" width="160" height="24" rx="4" fill="#f1f5f9"/>
  
  <!-- Refresh Button -->
  <rect x="685" y="66" width="95" height="32" rx="6" fill="#2563eb"/>
  <rect x="710" y="78" width="45" height="8" rx="4" fill="#ffffff"/>

  <!-- Table Header Bar -->
  <rect x="20" y="120" width="760" height="30" fill="#e2e8f0"/>

  <!-- Table Rows (Abstracted Data) -->
  
  <!-- Row 1 (Gray Background) -->
  <rect x="20" y="150" width="760" height="40" fill="#f8fafc"/>
  <rect x="30" y="166" width="90" height="8" rx="4" fill="#94a3b8"/>
  <rect x="140" y="166" width="110" height="8" rx="4" fill="#cbd5e1"/>
  <!-- Input box simulating internal notes -->
  <rect x="280" y="158" width="140" height="24" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
  <!-- Status Indicator: Green (Ready for Service) -->
  <rect x="440" y="164" width="90" height="12" rx="6" fill="#dcfce3"/>
  <rect x="450" y="167" width="70" height="6" rx="3" fill="#22c55e"/>
  <rect x="550" y="166" width="210" height="8" rx="4" fill="#cbd5e1"/>

  <!-- Row 2 (White Background, Tall Row for big note) -->
  <rect x="30" y="216" width="90" height="8" rx="4" fill="#94a3b8"/>
  <rect x="140" y="216" width="110" height="8" rx="4" fill="#cbd5e1"/>
  <!-- Tall input box simulating multi-line internal note -->
  <rect x="280" y="198" width="140" height="44" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="288" y="206" width="120" height="4" rx="2" fill="#e2e8f0"/>
  <rect x="288" y="216" width="100" height="4" rx="2" fill="#e2e8f0"/>
  <rect x="288" y="226" width="110" height="4" rx="2" fill="#e2e8f0"/>
  <!-- Status Indicator: Orange (Cancellation Review) -->
  <rect x="440" y="214" width="90" height="12" rx="6" fill="#ffedd5"/>
  <rect x="450" y="217" width="70" height="6" rx="3" fill="#f97316"/>
  <rect x="550" y="216" width="210" height="8" rx="4" fill="#cbd5e1"/>

  <!-- Row 3 (Gray Background) -->
  <rect x="20" y="250" width="760" height="40" fill="#f8fafc"/>
  <rect x="30" y="266" width="90" height="8" rx="4" fill="#94a3b8"/>
  <rect x="140" y="266" width="110" height="8" rx="4" fill="#cbd5e1"/>
  <rect x="280" y="258" width="140" height="24" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
  <!-- Status Indicator: Red (Scheduling Needed) -->
  <rect x="440" y="264" width="90" height="12" rx="6" fill="#fee2e2"/>
  <rect x="450" y="267" width="70" height="6" rx="3" fill="#ef4444"/>
  <rect x="550" y="266" width="210" height="8" rx="4" fill="#cbd5e1"/>

  <!-- Row 4 (White Background) -->
  <rect x="30" y="306" width="90" height="8" rx="4" fill="#94a3b8"/>
  <rect x="140" y="306" width="110" height="8" rx="4" fill="#cbd5e1"/>
  <rect x="280" y="298" width="140" height="24" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
  <!-- Status Indicator: Red -->
  <rect x="440" y="304" width="90" height="12" rx="6" fill="#fee2e2"/>
  <rect x="450" y="307" width="70" height="6" rx="3" fill="#ef4444"/>
  <rect x="550" y="306" width="210" height="8" rx="4" fill="#cbd5e1"/>

  <!-- Row 5 (Gray Background) -->
  <rect x="20" y="330" width="760" height="40" fill="#f8fafc"/>
  <rect x="30" y="346" width="90" height="8" rx="4" fill="#94a3b8"/>
  <rect x="140" y="346" width="110" height="8" rx="4" fill="#cbd5e1"/>
  <rect x="280" y="338" width="140" height="24" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
  <!-- Status Indicator: Green -->
  <rect x="440" y="344" width="90" height="12" rx="6" fill="#dcfce3"/>
  <rect x="450" y="347" width="70" height="6" rx="3" fill="#22c55e"/>
  <rect x="550" y="346" width="210" height="8" rx="4" fill="#cbd5e1"/>
  
  <!-- Row 6 (White Background) -->
  <rect x="30" y="386" width="90" height="8" rx="4" fill="#94a3b8"/>
  <rect x="140" y="386" width="110" height="8" rx="4" fill="#cbd5e1"/>
  <rect x="280" y="378" width="140" height="24" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
  <!-- Status Indicator: Red -->
  <rect x="440" y="384" width="90" height="12" rx="6" fill="#fee2e2"/>
  <rect x="450" y="387" width="70" height="6" rx="3" fill="#ef4444"/>
  <rect x="550" y="386" width="210" height="8" rx="4" fill="#cbd5e1"/>
  
  <!-- Bottom fade gradient to blend smoothly into the card -->
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1" />
    </linearGradient>
  </defs>
  <rect x="0" y="350" width="800" height="100" fill="url(#fade)" rx="12"/>
</svg>
